name: SentryRelease

# A production release, so only for what production runs: `main`. `develop`
# goes to staging and demo (deploy.yml), and a release cut from each push there
# would claim to be production.
on:
  push:
    branches:
      - main

# Read-only, whatever the repository default is: this is a public repository
# and nothing here needs to write to it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create a Sentry.io release
        # Pinned by commit like deploy.yml's actions: this third-party step is
        # handed SENTRY_AUTH_TOKEN, and a tag can be moved to other code.
        uses: tclindner/sentry-releases-action@71e9a4611c14695815cb896f664ef1c00e23d848 # v1.2.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: meteocool
          SENTRY_PROJECT: web
        with:
          tagName: ${{github.sha}}
          environment: production
          releaseNamePrefix:
          sourceMapOptions: '{"include": ["dist"]}'
