<!DOCTYPE html>
<html>
<head>
    <title>Test Map Tiles</title>
    <style>
        body { margin: 0; height: 100vh; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="module">
        // Simple test to check if map tiles load from map.meteocool.com
        import Map from 'http://127.0.0.1:3000/src/layers/base.js';
        
        // Test the protomaps URL
        const testUrl = 'https://map.meteocool.com/20250602/0/0/0.mvt';
        
        fetch(testUrl)
            .then(response => {
                console.log('Protomaps test:', response.status, response.headers.get('content-type'));
                document.getElementById('map').innerHTML = 
                    `<p>Protomaps endpoint test: ${response.status === 200 ? 'SUCCESS' : 'FAILED'}</p>
                     <p>Content-Type: ${response.headers.get('content-type')}</p>`;
            })
            .catch(error => {
                console.error('Protomaps test failed:', error);
                document.getElementById('map').innerHTML = `<p>Error: ${error}</p>`;
            });
    </script>
</body>
</html>
